name: Deploy intro page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/index.html"
      - "public/styles.css"
      - "public/images/**"
      - "scripts/build-pages.js"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build static intro page
        run: node scripts/build-pages.js
        env:
          # 在 Settings → Secrets and variables → Actions → Variables 設定 APP_URL，
          # 「產生測試」按鈕就會連到已部署的後端，例如 https://yourvalidationai.example.com
          APP_URL: ${{ vars.APP_URL }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
